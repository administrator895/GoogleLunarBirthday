name: sync-birthdays

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *"     # 每天北京时间 03:00（UTC 前一天 19:00）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GCONTACTS_EMAIL: ${{ secrets.GCONTACTS_EMAIL }}
      GCONTACTS_PASSWORD: ${{ secrets.GCONTACTS_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # 读通讯录 → 算农历 → 写日历，联系人只在内存中经过
      - run: python sync_birthdays.py
